name: Checks

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
        env:
          DJANGO_TEST_DATABASE_PATH: ${{ runner.temp }}/virtualq-tests.sqlite3

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npx expo install --check
      - run: npm run audit
      - run: npm run build:web
      - name: Export Android and iOS JavaScript
        run: npx expo export --platform android --platform ios --output-dir dist-native

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generate Android project from pinned Expo configuration
        run: npx expo prebuild --platform android --no-install
      - name: Build Android arm64 test APK
        working-directory: frontend/android
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a --console=plain --no-daemon
      - name: Check APK 16 KB zip alignment
        run: '"$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 android/app/build/outputs/apk/debug/app-debug.apk'
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: virtualq-android-arm64-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    # PRs cover feature branches without a duplicate macOS build on each push.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "1"
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      EXPO_PUBLIC_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generate iOS project from pinned Expo configuration
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        run: |
          gem install cocoapods --version 1.17.0 --no-document
          cp Podfile.lock ios/Podfile.lock
          cd ios
          pod _1.17.0_ install --deployment
      - name: Build unsigned iOS simulator app with bundled JavaScript
        run: |
          xcodebuild -version
          xcodebuild -quiet \
            -workspace ios/VirtualQ.xcworkspace \
            -scheme VirtualQ \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
      - name: Check and package simulator app
        run: |
          test -f build/ios/Build/Products/Release-iphonesimulator/VirtualQ.app/main.jsbundle
          lipo build/ios/Build/Products/Release-iphonesimulator/VirtualQ.app/VirtualQ -verify_arch arm64
          tar -C build/ios/Build/Products/Release-iphonesimulator \
            -czf build/VirtualQ.app.tar.gz VirtualQ.app
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: virtualq-ios-arm64-simulator-release
          path: |
            frontend/build/VirtualQ.app.tar.gz
            frontend/ios/Podfile.lock
          if-no-files-found: error
          retention-days: 7

  ios-startup:
    needs: ios
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v8.0.1
        with:
          name: virtualq-ios-arm64-simulator-release
          path: ${{ runner.temp }}/virtualq-ios-app
      - name: Launch the release app against an isolated demo backend
        shell: bash
        env:
          DJANGO_DATABASE_PATH: ${{ runner.temp }}/virtualq-ios-startup.sqlite3
          VIRTUALQ_IOS_ARTIFACT: ${{ runner.temp }}/virtualq-ios-app
          VIRTUALQ_IOS_EVIDENCE: ${{ runner.temp }}/virtualq-ios-startup-evidence
        run: |
          set -euo pipefail
          mkdir -p "$VIRTUALQ_IOS_EVIDENCE"
          tar -xzf "$VIRTUALQ_IOS_ARTIFACT/build/VirtualQ.app.tar.gz" -C "$VIRTUALQ_IOS_ARTIFACT"
          xcrun simctl list devices available --json > "$VIRTUALQ_IOS_EVIDENCE/devices.json"
          read -r vq_simulator vq_state < <(python - "$VIRTUALQ_IOS_EVIDENCE/devices.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as source:
              devices = json.load(source)["devices"]["com.apple.CoreSimulator.SimRuntime.iOS-26-4"]
          device = next(device for device in devices if device["name"] == "iPhone 17")
          print(device["udid"], device["state"])
          PY
          )
          python manage.py migrate --noinput
          python manage.py seed_demo
          python manage.py runserver 127.0.0.1:8000 --noreload > "$VIRTUALQ_IOS_EVIDENCE/backend.log" 2>&1 &
          vq_backend_pid=$!
          trap 'kill "$vq_backend_pid" 2>/dev/null || true; xcrun simctl shutdown "$vq_simulator" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/parkRides/theme_parks/ > /dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/parkRides/theme_parks/ > /dev/null
          if [ "$vq_state" != "Booted" ]; then xcrun simctl boot "$vq_simulator"; fi
          xcrun simctl bootstatus "$vq_simulator" -b
          xcrun simctl install "$vq_simulator" "$VIRTUALQ_IOS_ARTIFACT/VirtualQ.app"
          xcrun simctl launch --terminate-running-process "$vq_simulator" com.virtualq.app | tee "$VIRTUALQ_IOS_EVIDENCE/launch.txt"
          vq_received=false
          for attempt in {1..30}; do
            if grep -Fq 'GET /api/parkRides/theme_park_rides/ HTTP/1.1" 200' "$VIRTUALQ_IOS_EVIDENCE/backend.log"; then
              vq_received=true
              break
            fi
            sleep 1
          done
          sleep 3
          xcrun simctl io "$vq_simulator" screenshot "$VIRTUALQ_IOS_EVIDENCE/explore.png"
          if [ "$vq_received" != true ]; then
            echo "::error::The iOS app did not fetch the ride catalog successfully."
            exit 1
          fi
      - name: Upload iOS startup evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: virtualq-ios-startup-evidence
          path: ${{ runner.temp }}/virtualq-ios-startup-evidence
          if-no-files-found: warn
          retention-days: 7

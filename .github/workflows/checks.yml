name: Checks

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
        env:
          DJANGO_TEST_DATABASE_PATH: ${{ runner.temp }}/virtualq-tests.sqlite3

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npx expo install --check
      - run: npm run audit
      - run: npm run build:web
      - name: Export Android and iOS JavaScript
        run: npx expo export --platform android --platform ios --output-dir dist-native

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generate Android project from pinned Expo configuration
        run: npx expo prebuild --platform android --no-install
      - name: Build Android arm64 test APK
        working-directory: frontend/android
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=arm64-v8a --console=plain --no-daemon
      - name: Check APK 16 KB zip alignment
        run: '"$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 android/app/build/outputs/apk/debug/app-debug.apk'
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: virtualq-android-arm64-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    # PRs cover feature branches without a duplicate macOS build on each push.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "1"
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generate iOS project from pinned Expo configuration
        run: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        run: |
          gem install cocoapods --version 1.17.0 --no-document
          cd ios
          pod _1.17.0_ install
      - name: Build unsigned iOS simulator app with bundled JavaScript
        run: |
          xcodebuild -version
          xcodebuild -quiet \
            -workspace ios/VirtualQ.xcworkspace \
            -scheme VirtualQ \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
      - name: Check and package simulator app
        run: |
          test -f build/ios/Build/Products/Release-iphonesimulator/VirtualQ.app/main.jsbundle
          lipo -verify_arch arm64 build/ios/Build/Products/Release-iphonesimulator/VirtualQ.app/VirtualQ
          tar -C build/ios/Build/Products/Release-iphonesimulator \
            -czf build/VirtualQ.app.tar.gz VirtualQ.app
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: virtualq-ios-arm64-simulator-release
          path: |
            frontend/build/VirtualQ.app.tar.gz
            frontend/ios/Podfile.lock
          if-no-files-found: error
          retention-days: 7
